<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Captain Feed</title>
  <meta name="description" content="Colorful daily-dose feed. Books, tax tips, AWS notes, deals, and more." />
  <meta name="color-scheme" content="light dark" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand-row">
        <div>
          <h1 id="title">Captain Feed</h1>
          <p class="sub" id="subtitle">Daily doses</p>
        </div>
        <div style="display:flex;gap:8px">
          <button type="button" class="icon-btn" id="themeBtn" aria-label="Toggle theme">Dark</button>
          <button type="button" class="icon-btn" id="resetBtn" aria-label="Reset progress">Reset</button>
        </div>
      </div>
      <div class="filters" id="filters" role="toolbar" aria-label="Categories">
        <button type="button" class="chip" data-filter="all" aria-pressed="true">All</button>
        <button type="button" class="chip" data-filter="book" aria-pressed="false">Book</button>
        <button type="button" class="chip" data-filter="tax" aria-pressed="false">Tax</button>
        <button type="button" class="chip" data-filter="trend" aria-pressed="false">Trend</button>
        <button type="button" class="chip" data-filter="aws" aria-pressed="false">AWS</button>
        <button type="button" class="chip" data-filter="deal" aria-pressed="false">Deal</button>
        <button type="button" class="chip" data-filter="gym" aria-pressed="false">Gym</button>
      </div>
      <div class="stats" id="stats"></div>
    </header>

    <main class="feed" id="feed" aria-live="polite"></main>
  </div>

  <nav class="dock" id="dock" aria-label="Feed views">
    <button type="button" data-view="all" aria-pressed="true">All</button>
    <button type="button" data-view="unread" aria-pressed="false">Unread</button>
    <button type="button" data-view="saved" aria-pressed="false">Saved</button>
  </nav>

  <script src="app.js" defer></script>
</body>
</html>
